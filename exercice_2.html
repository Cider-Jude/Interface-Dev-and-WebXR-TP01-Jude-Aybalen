<html>
  <head>
    <!-- <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style='margin : 0px; overflow: hidden;'>
    <a-scene embedded arjs>
      <!-- <a-box position="0 0.5 0" color="#4CC3D9" material="opacity: 0.5"
      animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear"></a-box>
      <a-marker-camera preset='hiro'></a-marker-camera> -->

      <a-marker preset="hiro">
        <a-entity
          position="0 0 0"
          scale="0.05 0.05 0.05"
          gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
