<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script>
      AFRAME.registerComponent('change-color-on-click', {
        schema: {
          color: {default: '#4CC3D9'},
          normalSpeed: {default: 60},
          fastSpeed: {default: 120}
        },

        init: function () {
          var data = this.data;
          var el = this.el;

          this.defaultColor = el.getAttribute('material').color;
          this.speed = data.normalSpeed;

          el.removeAttribute('animation');

          el.addEventListener('click', () => {
            el.setAttribute('color', data.color);
            this.speed = data.fastSpeed;
          });

          el.addEventListener('mouseleave', () => {
            el.setAttribute('color', this.defaultColor);
            this.speed = data.normalSpeed;
          });

          el.addEventListener('ui-color-change', (evt) => {
            var newColor = evt.detail.color;
            this.defaultColor = newColor;
            el.setAttribute('color', newColor);
          });

          el.addEventListener('ui-size-change', (evt) => {
            var scale = evt.detail.scale;
            el.setAttribute('scale', {x: scale, y: scale, z: scale});
          });
        },

        tick: function (time, timeDelta) {
          var el = this.el;
          var rotation = el.getAttribute('rotation');
          el.setAttribute('rotation', {
            x: rotation.x,
            y: (rotation.y + this.speed * (timeDelta / 1000)) % 360,
            z: rotation.z
          });
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        var box = document.querySelector('#target-box');

        var buttons = document.querySelectorAll('.color-swatch');
        buttons.forEach((btn) => {
          btn.addEventListener('click', () => {
            var color = btn.getAttribute('data-color');
            box.emit('ui-color-change', {color: color});
          });
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
          box.emit('ui-color-change', {color: e.target.value});
        });

        var sizeSlider = document.getElementById('size-slider');
        sizeSlider.addEventListener('input', (e) => {
          box.emit('ui-size-change', {scale: parseFloat(e.target.value)});
        });

        var markers = document.querySelectorAll('a-marker');
        var ui = document.getElementById('ui-overlay');
        markers.forEach((marker) => {
          marker.addEventListener('markerFound', () => {
            ui.style.display = 'flex';
          });
          marker.addEventListener('markerLost', () => {
            var anyVisible = Array.from(markers).some(m => m.object3D.visible);
            if (!anyVisible) ui.style.display = 'none';
          });
        });
      });
    </script>
    <style>
      #ui-overlay {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 999;
        display: none;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
        background: rgba(0,0,0,0.35);
        padding: 10px 14px;
        border-radius: 10px;
      }
      .swatch-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .color-swatch {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        cursor: pointer;
      }
      .slider-row {
        display: flex;
        flex-direction: column;
        color: white;
        font-family: sans-serif;
        font-size: 12px;
      }
    </style>
  </head>
  <body style='margin: 0px; overflow: hidden;'>

    <div id="ui-overlay">
      <div class="swatch-row">
        <div class="color-swatch" style="background:#4CC3D9" data-color="#4CC3D9"></div>
        <div class="color-swatch" style="background:blue" data-color="blue"></div>
        <div class="color-swatch" style="background:red" data-color="red"></div>
        <div class="color-swatch" style="background:green" data-color="green"></div>
        <input type="color" id="color-picker" />
      </div>
      <div class="slider-row">
        <label for="size-slider">Cube size</label>
        <input type="range" id="size-slider" min="0.3" max="3" step="0.1" value="1" />
      </div>
    </div>

    <a-scene embedded arjs>
      <a-marker type="pattern" url="pattern-marker.patt">
        <a-sphere position="0 0 0" color="red" radius="0.5" material="opacity: 0.5"></a-sphere>
      </a-marker>
      <a-marker preset="hiro">
        <a-box id="target-box" position="0 0 0" color="#4CC3D9" material="opacity: 0.5"
               change-color-on-click="color: blue">
        </a-box>
      </a-marker>
      <a-entity camera>
        <a-cursor></a-cursor>
      </a-entity>
    </a-scene>

  </body>
</html>
