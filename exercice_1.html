<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-box position="0 0 -5" rotation="0 45 0" color="#EF2D5E"></a-sphere>
      <a-box position="1 0 -3" rotation="0 45 0" color="#FFC65D"></a-cylinder>
      <a-plane position="0 -2 -4" rotation="-90 0 0" width="15" height="15" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-entity camera look-controls position="0 10 15"></a-entity>
    </a-scene>
  </body>
</html>
