<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body style='margin : 0px; overflow: hidden;'>
    <a-scene embedded arjs>

      <a-marker preset="hiro">
        <a-box position="0 0.5 0" color="#4CC3D9" material="opacity: 0.5"
               animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear"
               event-set__enter="_event: click; color: #8FF7FF"
               event-set__leave="_event: mouseleave; color: #4CC3D9"></a-box>
      </a-marker>
      <a-entity camera>
        <a-cursor></a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
