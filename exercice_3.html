<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script>
      AFRAME.registerComponent('change-color-on-click', {
        schema: {
          color: {default: '#4CC3D9'},
          normalSpeed: {default: 60},  
          fastSpeed: {default: 120} 
        },

        init: function () {
          var data = this.data;
          var el = this.el;

          this.defaultColor = el.getAttribute('material').color;
          this.speed = data.normalSpeed;

          
          el.removeAttribute('animation');

          el.addEventListener('click', () => {
            el.setAttribute('color', data.color);
            this.speed = data.fastSpeed;
          });

          el.addEventListener('mouseleave', () => {
            el.setAttribute('color', this.defaultColor);
            this.speed = data.normalSpeed;
          });
        },

        tick: function (time, timeDelta) {
          var el = this.el;
          var rotation = el.getAttribute('rotation');
          el.setAttribute('rotation', {
            x: rotation.x,
            y: (rotation.y + this.speed * (timeDelta / 1000)) % 360,
            z: rotation.z
          });
        }
      });
</script>
  </head>
  <body style='margin : 0px; overflow: hidden;'>
    
    <a-scene embedded arjs>

      <a-marker preset="hiro">
        <a-box position="0 0 0" color="#4CC3D9" material="opacity: 0.5"
               change-color-on-click="color: blue">
        </a-box>
      </a-marker>
      <a-entity camera>
        <a-cursor></a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
